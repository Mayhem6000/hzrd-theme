<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HZRD – C_05</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --hzrd-white:#ffffff; --hzrd-black:#0a0a0a; --hzrd-panel:#f4f4f4;
  --hzrd-red:#c81e1e; --hzrd-line:#d8d8d8; --hzrd-line-soft:#eaeaea;
  --font-display:'Oswald','Arial Narrow',sans-serif; --font-mono:'IBM Plex Mono','Courier New',monospace; --font-body:'Work Sans','Helvetica Neue',sans-serif;
  --stripe: repeating-linear-gradient(45deg, var(--hzrd-black) 0 10px, var(--hzrd-white) 10px 20px);
}
*{box-sizing:border-box;}
html,body{background:var(--hzrd-black);color:var(--hzrd-white);font-family:var(--font-body);margin:0;}
a{color:inherit;text-decoration:none;}
.caution-rule{height:6px;background:var(--stripe);width:100%;}
.site-header{display:flex;align-items:center;justify-content:space-between;padding:22px 32px;border-bottom:1px solid var(--hzrd-line);flex-wrap:wrap;gap:14px;}
.site-header__logo{font-family:var(--font-display);font-size:26px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;}
.site-header__logo .dot{color:var(--hzrd-black);}
.site-nav{display:flex;gap:28px;font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;}
.site-nav a{border-bottom:1px solid transparent;padding-bottom:2px;}
.site-nav a:hover{border-color:var(--hzrd-black);}
.site-header__icons{display:flex;gap:18px;font-family:var(--font-mono);font-size:12px;}
.collection-intro{padding:48px 32px 24px;border-bottom:1px solid var(--hzrd-line);}
.collection-intro__eyebrow{font-family:var(--font-mono);font-size:12px;color:var(--hzrd-black);letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px;}
.collection-intro__title{font-family:var(--font-display);font-size:clamp(40px,6vw,88px);text-transform:uppercase;line-height:.95;margin:0;}
.collection-intro__meta{margin-top:14px;font-family:var(--font-mono);font-size:12px;color:#999;display:flex;gap:24px;}
.control-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 32px;border-bottom:1px solid var(--hzrd-line);font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;gap:16px;flex-wrap:wrap;}
.control-bar__group{display:flex;gap:28px;}
.ctrl-btn{background:none;border:none;padding:0;color:#888;font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;}
.ctrl-btn:hover,.ctrl-btn.is-open{color:var(--hzrd-black);}
.control-bar__count{color:#888;}
.panel{border-bottom:1px solid var(--hzrd-line);padding:16px 32px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;}
.panel__option{background:none;border:1px solid var(--hzrd-line);padding:7px 14px;color:var(--hzrd-black);cursor:pointer;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;}
.panel__option.is-active,.panel__option:hover{background:var(--hzrd-black);border-color:var(--hzrd-black);color:var(--hzrd-white);}
.panel__group{display:flex;gap:10px;flex-wrap:wrap;flex:1;}
.panel__clear{background:none;border:none;color:#888;cursor:pointer;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;text-decoration:underline;}
.panel__clear:hover{color:var(--hzrd-black);}
.chip{border:1px solid var(--hzrd-black);padding:7px 14px;cursor:pointer;background:transparent;color:var(--hzrd-black);font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;}
.chip:hover,.chip.is-active{background:var(--hzrd-black);border-color:var(--hzrd-black);color:var(--hzrd-white);}
.product-grid--compact{grid-template-columns:repeat(6,1fr);}
@media (max-width:1100px){.product-grid--compact{grid-template-columns:repeat(4,1fr);}}
@media (max-width:760px){.product-grid--compact{grid-template-columns:repeat(3,1fr);}}
.product-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--hzrd-line);border-top:1px solid var(--hzrd-line);}
@media (max-width:1100px){.product-grid{grid-template-columns:repeat(3,1fr);}}
@media (max-width:760px){.product-grid{grid-template-columns:repeat(2,1fr);}}
@media (max-width:480px){.product-grid{grid-template-columns:1fr;}}
.hz-card{background:var(--hzrd-black);position:relative;display:flex;flex-direction:column;}
.hz-card__corner{position:absolute;top:0;right:0;width:46px;height:46px;background:var(--stripe);clip-path:polygon(100% 0,0 0,100% 100%);z-index:2;}
.hz-card__media{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--hzrd-panel);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;color:#555;text-transform:uppercase;letter-spacing:.08em;text-align:center;padding:12px;}
.hz-card__soldout{position:absolute;bottom:10px;left:10px;font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:var(--hzrd-red);color:var(--hzrd-white);padding:4px 8px;z-index:2;}
.hz-card__data{padding:14px 14px 16px;border-top:1px solid var(--hzrd-line-soft);font-family:var(--font-mono);}
.hz-card__code{font-size:10px;color:#777;letter-spacing:.08em;margin-bottom:6px;}
.hz-card__name{font-family:var(--font-display);font-size:16px;text-transform:uppercase;letter-spacing:.02em;margin:0 0 8px;}
.hz-card__price-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;}
.hz-card__price.sale{color:var(--hzrd-red);}
.hz-index{display:flex;align-items:center;gap:5px;margin-top:10px;}
.hz-index__label{font-size:9px;color:#777;letter-spacing:.1em;margin-right:4px;}
.hz-index__bar{width:10px;height:6px;background:var(--hzrd-line-soft);}
.hz-index__bar.filled{background:var(--hzrd-black);}
.hero{min-height:60vh;display:flex;flex-direction:column;justify-content:flex-end;padding:40px 32px;border-bottom:1px solid var(--hzrd-line);}
.hero__tag{font-family:var(--font-mono);font-size:12px;color:var(--hzrd-black);letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px;}
.hero__title{font-family:var(--font-display);font-size:clamp(48px,9vw,140px);line-height:.88;text-transform:uppercase;margin:0 0 20px;}
.hero__cta{display:inline-block;border:1px solid var(--hzrd-black);color:var(--hzrd-black);font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:12px 24px;width:fit-content;}
.hero__cta:hover{background:var(--hzrd-black);color:var(--hzrd-white);}
.site-footer{border-top:1px solid var(--hzrd-line);padding:32px;display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:11px;color:#888;letter-spacing:.06em;text-transform:uppercase;flex-wrap:wrap;gap:12px;}
.site-footer a:hover{color:var(--hzrd-black);text-decoration:underline;}
</style>
</head>
<body>

<div class="caution-rule"></div>
<header class="site-header">
  <a href="#" class="site-header__logo">HZRD</a>
  <nav class="site-nav">
    <a href="#">Shop</a><a href="#">Showroom</a><a href="#">Archive</a><a href="#">Contact</a>
  </nav>
  <div class="site-header__icons"><a href="#">Cart (0)</a></div>
</header>

<section class="hero">
  <div class="hero__tag">Collection 05 / In Stock Now</div>
  <a href="#grid" class="hero__cta">Enter the Collection</a>
</section>

<div class="collection-intro" id="grid">
  <div class="collection-intro__eyebrow">Ready-to-Wear / 12 Units Catalogued</div>
  <h1 class="collection-intro__title">C_05</h1>
  <div class="collection-intro__meta"><span>12 PRODUCTS</span><span>UPDATED 17.07.2026</span></div>
</div>

<div class="control-bar">
  <div class="control-bar__group">
    <button class="ctrl-btn" id="hzrd-view-toggle">View</button>
    <button class="ctrl-btn" id="hzrd-sort-toggle">Sort</button>
    <button class="ctrl-btn" id="hzrd-refine-toggle">Refine</button>
  </div>
  <span class="control-bar__count" id="hzrd-count">12 products</span>
</div>

<div class="panel" id="hzrd-sort-panel" hidden>
  <button class="panel__option is-active" data-sort="featured">Featured</button>
  <button class="panel__option" data-sort="price-asc">Price, low to high</button>
  <button class="panel__option" data-sort="price-desc">Price, high to low</button>
  <button class="panel__option" data-sort="title-asc">Alphabetically, A-Z</button>
  <button class="panel__option" data-sort="title-desc">Alphabetically, Z-A</button>
</div>

<div class="panel" id="hzrd-refine-panel" hidden>
  <div class="panel__group" id="hzrd-filters">
    <button class="chip is-active" data-filter="all">All (12)</button>
    <button class="chip" data-filter="outerwear">Outerwear (3)</button>
    <button class="chip" data-filter="tops">Tops (3)</button>
    <button class="chip" data-filter="pants">Pants (3)</button>
    <button class="chip" data-filter="accessories">Accessories (3)</button>
  </div>
  <button class="panel__clear" id="hzrd-refine-clear">Clear</button>
</div>

<div class="product-grid" id="hzrd-grid"></div>

<footer class="site-footer">
  <span>© 2026 HZRD</span>
  <div><a href="#">Shipping</a> &nbsp;·&nbsp; <a href="#">Contact</a> &nbsp;·&nbsp; <a href="#">Instagram</a></div>
</footer>

<script>
const PRODUCTS = [
  {name:"Riot Shell Parka", type:"outerwear", price:129000, sale:false, sold:false, code:"114"},
  {name:"Storm Vest",       type:"outerwear", price:75000,  sale:false, sold:true,  code:"221"},
  {name:"Placard Hoodie",   type:"tops",      price:49000,  sale:false, sold:false, code:"338"},
  {name:"Spec Sheet Tee",   type:"tops",      price:21000,  sale:false, sold:false, code:"402"},
  {name:"Caution Longsleeve", type:"tops",    price:27500,  sale:false, sold:false, code:"455"},
  {name:"Raw Crash Pants",  type:"pants",     price:59000,  sale:false, sold:false, code:"512"},
  {name:"Tape Seam Trouser",type:"pants",     price:59000,  sale:false, sold:false, code:"560"},
  {name:"Bleach Straight Leg", type:"pants",  price:55000,  sale:false, sold:false, code:"601"},
  {name:"Trucker Cap",      type:"accessories", price:12500,sale:false, sold:false, code:"703"},
  {name:"Logo Beanie",      type:"accessories", price:14000,sale:false, sold:false, code:"718"},
  {name:"Maybach Tote",     type:"accessories", price:150000,sale:false,sold:true,  code:"744"},
  {name:"Bomber Jacket",    type:"outerwear", price:125000, sale:false, sold:false, code:"810"}
];

function money(cents) { return "$" + (cents/100).toFixed(2); }

const grid = document.getElementById('hzrd-grid');
function render(list) {
  grid.innerHTML = list.map(p => `
    <div class="hz-grid-item" data-type="${p.type}" data-price="${p.price}" data-title="${p.name.toLowerCase()}">
      <div class="hz-card">
        <div class="hz-card__corner"></div>
        <div class="hz-card__media">${p.name} — PRODUCT IMAGE${p.sold ? '<span class="hz-card__soldout">Sold Out</span>' : ''}</div>
        <div class="hz-card__data">
          <div class="hz-card__code">CODE ${p.code} / ${p.type.toUpperCase()}</div>
          <h3 class="hz-card__name">${p.name}</h3>
          <div class="hz-card__price-row">
            <span class="hz-card__price">${money(p.price)}</span>
            <span>${Math.ceil(Math.random()*4)} OPT</span>
          </div>
          <div class="hz-index">
            <span class="hz-index__label">HZRD IDX</span>
            ${[1,2,3,4,5].map(i => `<span class="hz-index__bar${i <= Math.min(5, Math.ceil(p.price/30000)) ? ' filled' : ''}"></span>`).join('')}
          </div>
        </div>
      </div>
    </div>
  `).join('');
}
render(PRODUCTS);

let activeFilter = 'all';
let activeSort = 'featured';
let compactView = false;

function refresh() {
  let list = activeFilter === 'all' ? PRODUCTS : PRODUCTS.filter(p => p.type === activeFilter);
  list = list.slice().sort((a, b) => {
    switch (activeSort) {
      case 'price-asc': return a.price - b.price;
      case 'price-desc': return b.price - a.price;
      case 'title-asc': return a.name.localeCompare(b.name);
      case 'title-desc': return b.name.localeCompare(a.name);
      default: return 0;
    }
  });
  document.getElementById('hzrd-count').textContent = list.length + ' products';
  render(list);
}

const sortPanel = document.getElementById('hzrd-sort-panel');
const refinePanel = document.getElementById('hzrd-refine-panel');
const sortBtn = document.getElementById('hzrd-sort-toggle');
const refineBtn = document.getElementById('hzrd-refine-toggle');
const viewBtn = document.getElementById('hzrd-view-toggle');

function closePanels() {
  sortPanel.hidden = true;
  refinePanel.hidden = true;
  sortBtn.classList.remove('is-open');
  refineBtn.classList.remove('is-open');
}

viewBtn.addEventListener('click', () => {
  compactView = !compactView;
  grid.classList.toggle('product-grid--compact', compactView);
  viewBtn.classList.toggle('is-open', compactView);
});

sortBtn.addEventListener('click', () => {
  const willOpen = sortPanel.hidden;
  closePanels();
  sortPanel.hidden = !willOpen;
  sortBtn.classList.toggle('is-open', willOpen);
});

refineBtn.addEventListener('click', () => {
  const willOpen = refinePanel.hidden;
  closePanels();
  refinePanel.hidden = !willOpen;
  refineBtn.classList.toggle('is-open', willOpen);
});

document.getElementById('hzrd-filters').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  document.querySelectorAll('#hzrd-filters .chip').forEach(c => c.classList.remove('is-active'));
  chip.classList.add('is-active');
  activeFilter = chip.dataset.filter;
  refresh();
});

document.getElementById('hzrd-refine-clear').addEventListener('click', () => {
  activeFilter = 'all';
  document.querySelectorAll('#hzrd-filters .chip').forEach(c => c.classList.remove('is-active'));
  document.querySelector('#hzrd-filters [data-filter="all"]').classList.add('is-active');
  refresh();
});

sortPanel.addEventListener('click', e => {
  const opt = e.target.closest('.panel__option');
  if (!opt) return;
  sortPanel.querySelectorAll('.panel__option').forEach(o => o.classList.remove('is-active'));
  opt.classList.add('is-active');
  activeSort = opt.dataset.sort;
  refresh();
  closePanels();
});

document.addEventListener('click', e => {
  if (!e.target.closest('.control-bar') && !e.target.closest('.panel')) closePanels();
});
</script>

</body>
</html>
